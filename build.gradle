plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.1'
}

group = 'io.dsub.opendiscogs'
version = file('version.txt').getText('UTF-8').trim()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

springBoot {
    buildInfo {
        properties {
            time = null
        }
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    mockitoAgent
}

ext {
    set('jooqVersion', '3.21.6')
    set('openDiscogsJooqVersion', '0.0.5')
    set('springdocVersion', '3.0.3')
    set('testcontainersVersion', '2.0.5')
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    annotationProcessor platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    testAnnotationProcessor platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    mockitoAgent platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)

    implementation(
            'org.springframework.boot:spring-boot-starter-actuator',
            'org.springframework.boot:spring-boot-starter-data-r2dbc',
            'org.springframework.boot:spring-boot-starter-validation',
            'org.springframework.boot:spring-boot-starter-webflux',
            'org.postgresql:r2dbc-postgresql',
            "org.jooq:jooq:${jooqVersion}",
            "io.dsub.opendiscogs:open-discogs-jooq:${openDiscogsJooqVersion}",
            'io.micrometer:micrometer-registry-prometheus',
            "org.springdoc:springdoc-openapi-starter-webflux-ui:${springdocVersion}",
            'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    )

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor(
            'org.springframework.boot:spring-boot-configuration-processor',
            'org.projectlombok:lombok'
    )

    testImplementation platform("org.testcontainers:testcontainers-bom:${testcontainersVersion}")
    testImplementation(
            'org.springframework.boot:spring-boot-starter-test',
            'org.springframework.boot:spring-boot-starter-data-r2dbc-test',
            'org.springframework.boot:spring-boot-starter-webflux-test',
            'io.projectreactor:reactor-test',
            'org.testcontainers:testcontainers',
            'org.testcontainers:testcontainers-junit-jupiter',
            'org.testcontainers:testcontainers-postgresql',
            'org.junit.platform:junit-platform-launcher'
    )
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    mockitoAgent('org.mockito:mockito-core') {
        transitive = false
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.compilerArgs += ['-Xlint:all,-processing', '-Werror']
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    jvmArgs += "-javaagent:${configurations.mockitoAgent.asPath}"
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

test {
    useJUnitPlatform {
        excludeTags 'integration', 'e2e'
    }
}

tasks.register('integrationTest', Test) {
    description = 'Runs PostgreSQL integration tests.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
    shouldRunAfter test
}

tasks.register('e2eTest', Test) {
    description = 'Runs full-stack HTTP and PostgreSQL end-to-end tests.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'e2e'
    }
    shouldRunAfter integrationTest
}

tasks.register('validateTestClassNames') {
    description = 'Enforces UnitTest, IntegrationTest, and E2ETest names for executable tests.'
    group = 'verification'
    inputs.files(fileTree('src/test/java') {
        include '**/*.java'
    })
    doLast {
        def invalid = inputs.files.files.findAll { source ->
            source.getText('UTF-8').contains('@Test')
                    && !(source.name ==~ /.*(Unit|Integration|E2E)Test\.java/)
        }
        if (!invalid.isEmpty()) {
            throw new GradleException(
                    "Executable tests must use UnitTest, IntegrationTest, or E2ETest:\n - "
                            + invalid.collect { project.relativePath(it) }.sort().join('\n - '))
        }
    }
}

def coverageExclusions = [
        'io/dsub/opendiscogs/api/config/**',
        'io/dsub/opendiscogs/api/**/*DTO.*',
        'io/dsub/opendiscogs/api/**/query/**',
        'io/dsub/opendiscogs/api/Application.*'
]

jacocoTestReport {
    dependsOn test, integrationTest, e2eTest
    executionData test, integrationTest, e2eTest
    reports {
        xml.required = true
        html.required = true
    }
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: coverageExclusions)
    }))
}

jacocoTestCoverageVerification {
    dependsOn test, integrationTest, e2eTest
    executionData test, integrationTest, e2eTest
    classDirectories.setFrom(files(sourceSets.main.output.classesDirs.collect {
        fileTree(dir: it, exclude: coverageExclusions)
    }))
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.85
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.40
            }
        }
    }
}

check {
    dependsOn integrationTest, e2eTest, jacocoTestReport, jacocoTestCoverageVerification,
            validateTestClassNames
}

tasks.withType(Jar).configureEach {
    metaInf {
        from(rootProject.file('LICENSE'))
        from(rootProject.file('NOTICE'))
    }
}
