# netty
server:
  shutdown: graceful
  port: 8080
  http2:
    enabled: true
  forward-headers-strategy: native
spring:
  application:
    name: open-discogs-api
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
  main:
    banner-mode: off
  lifecycle:
    timeout-per-shutdown-phase: 30s
management:
  tracing:
    sampling:
      probability: 0.1
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  server:
    port: 8081
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: 'true'
    tags:
      application: open-discogs-api
  endpoint:
    health:
      probes:
        enabled: on
logging:
  level:
    root: INFO
    io.dsub.opendiscogs: INFO
    io.r2dbc.postgresql.QUERY: WARN
    io.r2dbc.postgresql.PARAM: WARN
  pattern:
    level: "trace_id=%mdc{trace_id} span_id=%mdc{span_id} trace_flags=%mdc{trace_flags} %p"
springdoc:
  swagger-ui:
    disable-swagger-default-url: true
    urls-primary-name: Public
    display-request-duration: true
    defaultModelsExpandDepth: -1
    use-root-path: true
  enable-native-support: true
  default-flat-param-object: true
  api-docs:
    groups:
      enabled: true
