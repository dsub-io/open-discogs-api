name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
  schedule:
    - cron: '31 8 * * 3'
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'edited' && !github.event.changes.base && 'metadata' || 'verification' }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ github.event.action == 'edited' && !github.event.changes.base && 'PR metadata' || 'Verify' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changes
        id: changes
        run: python3 .github/scripts/classify_changes.py

      - name: Test CI routing
        if: steps.changes.outputs.ci == 'true'
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Validate workflows and release metadata
        if: steps.changes.outputs.ci == 'true'
        run: bash .github/scripts/check-workflows.sh

      - name: Review dependency changes
        if: github.event_name == 'pull_request' && steps.changes.outputs.heavy == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

      - name: Set up Java
        if: steps.changes.outputs.heavy == 'true'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate the Gradle wrapper
        if: steps.changes.outputs.heavy == 'true'
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Gradle
        if: steps.changes.outputs.heavy == 'true'
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-disabled: true

      - name: Initialize CodeQL
        if: steps.changes.outputs.heavy == 'true'
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended,security-and-quality

      - name: Build, test, and enforce coverage
        if: steps.changes.outputs.heavy == 'true'
        run: ./gradlew clean check --no-daemon --warning-mode=fail

      - name: Analyze with CodeQL
        if: steps.changes.outputs.heavy == 'true'
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:java-kotlin

      - name: Build the production container
        if: steps.changes.outputs.heavy == 'true'
        run: docker build --tag open-discogs-api:ci .
